function showDetails(id){const m=byId.get(id);if(!m)return;openModal(`<h2 id="ma-modal-title">${E(m.title)}</h2>${platformTag(m)}${familyInfo(m)}<div style="margin-top:16px">${m.photos.length?`<div class="ma-detailgallery">${m.photos.map((p,i)=>`<figure>${photoButton(m,p,i)}<figcaption>${E(photoLabel(p))} · © ${E(p.credit)}${photoScope(p)?'<br>'+E(photoScope(p)):''}</figcaption></figure>`).join('')}</div>`:gallery(m)}</div><div class="ma-detailgrid"><section><h3>${E(t('hardware'))}</h3><table class="ma-detailtable"><tbody><tr><th scope="row">${E(t('board'))}</th><td>${E(m.board)}</td></tr><tr><th scope="row">${E(t('battery'))}</th><td>${E(m.battery)}</td></tr><tr><th scope="row">${E(t('nominal'))}</th><td>${E(m.battery_dimensions)}</td></tr><tr><th scope="row">${E(t('license'))}</th><td>${E(licenseText(m))}</td></tr></tbody></table>${componentTable(m)}${specificationTable(m)}<h3>${E(t('bom'))}</h3><ul>${(m.parts.length?m.parts:[t('noParts')]).map(p=>'<li>'+E(p)+'</li>').join('')}</ul>${m.compatibility_note?'<h3>'+E(lang==='zh'?'相容性／驗證限制':'Compatibility / verification limits')+'</h3><p class="ma-description">'+E(m.compatibility_note)+'</p>':''}${m.notes?'<h3>'+E(t('notes'))+'</h3><p class="ma-description">'+E(m.notes)+'</p>':''}${m.solar?'<h3>'+E(t('solarSpecs'))+'</h3>'+solarTable(m):''}</section><section><h3>${E(t('support'))}</h3><div class="ma-featuregrid">${featureKeys.map(k=>`<div><span>${E(featureNames[lang][k])}</span><span class="ma-tag ${statusClass(m.features[k])}">${E(featureStatus(m,k))}</span></div>`).join('')}</div><h3>${E(t('sources'))}</h3>${componentSources(m)}</section></div>`,{kind:'detail',id});}
function imageRights(p){const license=p.image_license||p.reuse_permission||'Permission not confirmed / 尚未確認再散布許可';return '<p class="ma-description">'+E(p.attribution||('© '+(p.credit||'Creator')+' · '+license))+(p.license_url?' · '+link(p.license_url,lang==='zh'?'圖片授權條款':'Image license terms'):'')+'</p>';}
function showPhoto(id,index){const m=byId.get(id),p=m?.photos[index];if(!p)return;openModal(`<h2 id="ma-modal-title">${E(m.title)}</h2><span class="ma-tag ${p.kind==='photo'?'ok':'render'}">${E(photoLabel(p))}</span><span class="ma-small"> ${index+1} / ${m.photos.length} · © ${E(p.credit)}</span><div class="ma-bigphoto-wrap">${imageMarkup(m,p,index,true)}${imageTools(m,index)}</div>${imageRights(p)}<p class="ma-description">${E(photoCaption(m,p,index))}${photoScope(p)?' · '+E(photoScope(p)):''}</p><div class="ma-actions">${link(p.original_image_url||p.url,t('viewOriginalImage'),'ma-btn')}${link(p.source_url||m.url,t('sourceGallery'),'ma-btn')}<button class="ma-btn" data-act="details" data-id="${E(m.id)}">${E(t('backDetails'))}</button></div>`,{kind:'photo',id,index});}
function showCompare(){const a=[...selected].map(id=>byId.get(id)).filter(Boolean);if(!a.length){openModal(`<h2 id="ma-modal-title">${E(t('compareTitle'))}</h2><p>${E(t('compareEmpty'))}</p>`,{kind:'compare'});return;}const rows=[['images',m=>compareGallery(m)],['board',m=>E(m.board)],['battery',m=>E(m.battery)],['nominal',m=>E(m.battery_dimensions)],['solarSpecs',m=>m.solar?solarTable(m):E(t('notSolar'))],...featureKeys.map(k=>[k,m=>E(featureStatus(m,k))]),['components',m=>componentTable(m)],['specifications',m=>specificationTable(m)],['notes',m=>E(m.notes)],['license',m=>E(licenseText(m))],['sources',m=>link(m.url,t('original'))]];openModal(`<h2 id="ma-modal-title">${E(t('compareTitle'))}</h2><div class="ma-tablewrap"><table class="ma-comparetable" style="min-width:${115+a.length*270}px"><thead><tr><th>${E(t('project'))}</th>${a.map(m=>`<th>${link(m.url,m.title)}<br>${E(m.id)} · ${E(m.platform)}</th>`).join('')}</tr></thead><tbody>${rows.map(([k,fn])=>`<tr><th scope="row">${E(featureNames[lang][k]||t(k))}</th>${a.map(m=>'<td>'+fn(m)+'</td>').join('')}</tr>`).join('')}</tbody></table></div>`,{kind:'compare'});}
function csvCell(v){let s=String(v??'');if(/^[\s\uFEFF]*[=+@\-]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return {name,text,type};}
function exportCSV(){const headers=['ID',t('project'),t('platform'),t('board'),t('battery'),t('batteryDimensions'),t('panelW')+' (W)',t('voltage')+' (V)',t('panelCount'),t('totalW')+' (W)',t('basis'),t('dimensions')+' (mm)',t('solarSpecs'),t('notes'),t('images'),t('photoCount'),'URL',t('bom'),t('specifications'),t('components'),...featureKeys.map(k=>featureNames[lang][k]),...featureKeys.map(k=>k+' evidence state'),t('license')];const rows=resultSet().map(m=>[m.id,m.title,m.platform,m.board,m.battery,m.battery_dimensions,m.solar?.panel_w,m.solar?.voltage_v,m.solar?.panel_count,m.solar?.total_w,m.solar?t(m.solar.basis):'',m.solar?.dimensions_mm,m.solar?[m.solar.label,m.solar.notes].filter(Boolean).join(' · '):'',m.notes,m.image_count,m.actual_photo_count,m.url,m.parts.join(' | '),Object.entries(m.specs||{}).map(([k,v])=>k+': '+(typeof v==='string'?v:JSON.stringify(v))).join(' | '),(m.component_specs||[]).map(c=>(c.label||featureNames[lang][c.key]||c.key)+': '+c.value).join(' | '),...featureKeys.map(k=>featureCSV(m,k)),...featureKeys.map(k=>featureState(m,k)),licenseText(m)]);return download('meshtastic_catalog_'+lang+'.csv','\ufeff'+[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function imagePermission(p){if(lang==='zh')return p.reuse_permission||'';const values={
'專案MIT授權不自動代表照片有相同再散布授權；需另核':'Project MIT license does not establish photo redistribution permission; permission unconfirmed',
'圖庫來源已對應；照片再利用權利未獨立核實，模型授權不自動等於照片授權':'Photo reuse permission not independently verified; model license does not establish photo permission',
'照片再利用授權未獨立核實；模型授權不自動等於照片授權':'Photo reuse permission not independently verified; model license does not establish photo permission'};return values[p.reuse_permission]||p.reuse_permission||'';}
function exportImages(){const rows=[['ID',t('project'),t('sourceImage'),t('photoCredit'),lang==='zh'?'圖片說明':'Caption',lang==='zh'?'圖片網址':'Image URL',t('source'),'Validation','Permission','Evidence URL','Image scope','Image checked','Display URL','Source-observed fallback URLs','Session state']];models.forEach(m=>m.photos.forEach((p,i)=>rows.push([m.id,m.title,photoLabel(p),p.credit,photoCaption(m,p,i),p.url,p.source_url||m.url,p.validation||'',imagePermission(p),p.evidence_url||p.source_url||m.url,p.image_scope||p.public_scope||'',p.checked||'',p.display_url||p.url,(p.fallback_urls||[]).join(' | '),imageStates.get(imageKey(m,i))||'not_encountered'])));return download('meshtastic_image_sources_'+lang+'.csv','\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function setLanguage(value){lang=value==='en'?'en':'zh';refresh();if(modalState){const ms=modalState;if(ms.kind==='detail')showDetails(ms.id);else if(ms.kind==='photo')showPhoto(ms.id,ms.index);else showCompare();}}
root.addEventListener('load',ev=>{if(ev.target.tagName==='IMG')handleImageLoad(ev.target);},true);
root.addEventListener('error',ev=>{if(ev.target.tagName==='IMG')handleImageError(ev.target);},true);
root.addEventListener('click',ev=>{const el=ev.target.closest('[data-act],[data-tab]');if(!el||!root.contains(el))return;if(el.dataset.tab){tab=el.dataset.tab;$$('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));['models','solar'].forEach(k=>$('#ma-panel-'+k).hidden=k!==tab);return;}const a=el.dataset.act,id=el.dataset.id;
if(a==='family'){filters.family=el.dataset.family;filters.board='';page=1;renderFilters();renderModels();return;}
if(a==='language'){setLanguage(lang==='zh'?'en':'zh');return;}
if(a==='fullscreen'){if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}else if(document.fullscreenEnabled && document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>alert(lang==='zh'?'無法啟用全螢幕，請使用「開啟完整頁面」。':'Full screen is unavailable. Please use Open full page.'));}else{alert(lang==='zh'?'此瀏覽器不支援全螢幕，請使用「開啟完整頁面」。':'Full screen is unavailable. Please use Open full page.');}return;}
if(a==='reset'){Object.assign(filters,{family:'',q:'',platform:'',kind:'',board:'',battery:'',count:'',photos:'',solar:'',minw:'',optional:false,estimates:false,sort:'coverage'});filters.features.clear();page=1;renderFilters();renderModels();return;}
if(a==='feature'){const f=el.dataset.feature;if(filters.features.has(f))filters.features.delete(f);else filters.features.add(f);el.setAttribute('aria-pressed',String(filters.features.has(f)));page=1;renderModels();return;}
if(a==='view'){view=view==='table'?'cards':'table';renderModels();return;}
if(a==='gallery'){filters.photos='three';$('#ma-photos').value='three';page=1;renderModels();return;}
if(a==='prev'||a==='next'){page+=a==='prev'?-1:1;renderModels();$('#ma-results-start').scrollIntoView({block:'start',behavior:'smooth'});return;}
if(a==='details'){showDetails(id);return;}
if(a==='retryImage'){retryImage(id,Number(el.dataset.idx));return;}
if(a==='photo'){showPhoto(id,Number(el.dataset.idx));return;}
if(a==='close'){closeModal();return;}
if(a==='select'){if(selected.has(id))selected.delete(id);else if(selected.size<4)selected.add(id);else{window.alert(t('compareMax'));return;}renderModels();return;}
if(a==='compare'){showCompare();return;}
if(a==='export'){exportCSV();return;}
if(a==='json'){download('meshtastic_public_catalog_'+D.version+'.json',JSON.stringify({...D,public_display:publicData},null,2),'application/json;charset=utf-8');return;}
if(a==='imageAudit')exportImages();
});
$('#ma-modal').addEventListener('click',e=>{if(e.target.id==='ma-modal')closeModal();});
root.addEventListener('keydown',e=>{if($('#ma-modal').hidden)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const f=$$('.ma-dialog button,.ma-dialog a[href],.ma-dialog input,.ma-dialog select').filter(x=>!x.disabled);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});

[['ma-optional','optional'],['ma-estimates','estimates']].forEach(([id,k])=>$('#'+id).addEventListener('change',e=>{filters[k]=e.target.checked;page=1;renderModels();}));
